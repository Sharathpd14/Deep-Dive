{% extends "base.html" %}
{% block content %}
<h1>Ask a research question</h1>
<p class="lead">Claims that their source does not support are removed, and thin areas trigger more research.</p>

<form id="ask">
  <textarea id="q" rows="3" minlength="10" maxlength="500" required
    placeholder="What are the main risks of investing in the EV battery market in 2026?"></textarea>
  <p><button id="go" type="submit">Start research</button></p>
  <p id="msg" class="msg"></p>
</form>

{% if runs %}
<h2>Recent runs</h2>
<ul class="runs">
  {% for r in runs %}
  <li><a href="/runs/{{ r.id }}/view">{{ r.question }}</a> <span class="badge {{ r.status }}">{{ r.status }}</span></li>
  {% endfor %}
</ul>
{% endif %}

<script>
document.getElementById('ask').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('go'), msg = document.getElementById('msg');
  btn.disabled = true; msg.textContent = 'Starting…';
  try {
    const res = await fetch('/runs', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: document.getElementById('q').value}),
    });
    const data = await res.json();
    if (res.status === 202) { location.href = '/runs/' + data.run_id + '/view'; return; }
    msg.textContent = typeof data.detail === 'string' ? data.detail : 'Please enter a question of 10 to 500 characters.';
  } catch (err) { msg.textContent = 'Could not reach the server.'; }
  btn.disabled = false;
});
</script>
{% endblock %}
