{% extends "base.html" %}
{% block title %}Report {{ run_id }}{% endblock %}
{% block content %}
<div class="actions noprint">

  <a href="/runs/{{ run_id }}/report">View Markdown</a>

</div>
<article class="report">{{ body|safe }}</article>
{% endblock %}
